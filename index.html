<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Smart Reminder</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .logo { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #6366f1; }
        .input-group { background: #1e293b; padding: 8px; border-radius: 16px; display: flex; gap: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 1rem; outline: none; }
        .action-btn { background: #6366f1; color: white; border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .action-btn.mic.listening { background: #ef4444; animation: pulse 1s infinite; }
        .action-btn.active { background: #ef4444; animation: pulse 1s infinite; }
        .date-widget { background: #1e293b; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .date-big { font-size: 2rem; font-weight: 700; color: #6366f1; }
        .date-day { color: #94a3b8; text-transform: uppercase; font-size: 0.85rem; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .stat-card { background: #1e293b; padding: 12px 8px; border-radius: 12px; text-align: center; }
        .stat-num { font-size: 1.3rem; font-weight: 700; color: #6366f1; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; }
        .reminder-list { display: flex; flex-direction: column; gap: 10px; }
        .reminder-item { background: #1e293b; padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #6366f1; }
        .reminder-item.completed { border-left-color: #10b981; opacity: 0.7; }
        .reminder-item.overdue { border-left-color: #ef4444; animation: pulseOverdue 2s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        @keyframes pulseOverdue { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); } 50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } }
        .r-info h4 { font-size: 0.95rem; margin-bottom: 4px; }
        .r-info p { font-size: 0.8rem; color: #94a3b8; }
        .actions { display: flex; gap: 6px; }
        .btn-icon { background: #0f172a; border: none; color: #94a3b8; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
        .empty { text-align: center; padding: 40px; color: #94a3b8; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; padding: 14px 20px; border-radius: 12px; border-left: 4px solid #6366f1; transition: transform 0.3s; z-index: 100; display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .install-help { background: #1e293b; padding: 15px; border-radius: 12px; margin: 15px 0; display: none; }
        .install-help.show { display: block; }
        .debug-info { background: #1e293b; padding: 10px; border-radius: 8px; margin: 15px 0; font-size: 0.85rem; color: #94a3b8; }
        .alert-banner { background: #ef4444; padding: 12px; border-radius: 8px; margin: 15px 0; display: none; text-align: center; }
        .alert-banner.show { display: block; }
        .alert-banner button { background: white; color: #ef4444; border: none; padding: 6px 16px; border-radius: 6px; margin-left: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><i class="fas fa-bolt"></i><span>Smart Reminder</span></div>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" id="repeatBtn" title="Toggle repeating alerts"><i class="fas fa-redo"></i></button>
                <button class="action-btn" id="notifBtn"><i class="fas fa-bell"></i></button>
            </div>
        </header>

        <div class="install-help show" id="installHelp">📱 <b>Install:</b> Tap ⋮ → "Add to Home screen"</div>
        
        <div class="alert-banner" id="alertBanner">
            🔔 <b>Active Alerts!</b> Reminders are ringing every 5s
            <button onclick="app.stopAllAlerts()">Stop</button>
        </div>
        
        <div class="debug-info" id="debugInfo">⏰ Scheduler: Running</div>

        <div class="date-widget">
            <div class="date-day" id="currentDay">Friday</div>
            <div class="date-big" id="currentDate">20</div>
            <div style="color: #94a3b8; font-size: 0.9rem;" id="currentMonth">Feb 2026</div>
        </div>

        <div class="input-group">
            <button class="action-btn mic" id="micBtn" title="Tap to speak">
                <i class="fas fa-microphone"></i>
            </button>
            <input type="text" id="taskInput" placeholder="🎤 Say: 'Meeting tomorrow at 3pm'">
            <button class="action-btn" id="addBtn"><i class="fas fa-plus"></i></button>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-num" id="countPending">0</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-num" id="countToday">0</div><div class="stat-label">Today</div></div>
            <div class="stat-card"><div class="stat-num" id="countDone">0</div><div class="stat-label">Done</div></div>
        </div>

        <div id="reminderList" class="reminder-list"></div>
    </div>

    <div id="toast" class="toast"><i class="fas fa-bell"></i><span id="toastMsg">Reminder</span></div>

    <audio id="notifSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ⭐ ENHANCED SERVICE WORKER FOR BACKGROUND NOTIFICATIONS
        if ('serviceWorker' in navigator) {
            // Create inline service worker blob
            const swCode = `
                const REMINDERS_KEY = 'reminder_alerts';
                
                self.addEventListener('install', event => {
                    self.skipWaiting();
                });
                
                self.addEventListener('activate', event => {
                    event.waitUntil(self.clients.claim());
                });
                
                // Listen for messages from main app
                self.addEventListener('message', event => {
                    if (event.data && event.data.type === 'SCHEDULE_NOTIFICATION') {
                        const { reminder } = event.data;
                        const triggerTime = new Date(reminder.time);
                        const now = new Date();
                        
                        // Schedule notification using setTimeout (works while SW is active)
                        const delay = triggerTime - now;
                        if (delay > 0 && delay < 24 * 60 * 60 * 1000) {
                            setTimeout(() => {
                                self.registration.showNotification('⏰ REMINDER!', {
                                    body: reminder.text,
                                    icon: 'https://cdn-icons-png.flaticon.com/512/3239/3239952.png',
                                    badge: 'https://cdn-icons-png.flaticon.com/512/3239/3239952.png',
                                    tag: reminder.id.toString(),
                                    requireInteraction: true,
                                    vibrate: [500, 200, 500, 200, 500],
                                    silent: false,
                                    data: { reminderId: reminder.id }
                                });
                            }, delay);
                        }
                    }
                    
                    if (event.data && event.data.type === 'TRIGGER_NOW') {
                        const { reminder } = event.data;
                        self.registration.showNotification('⏰ REMINDER!', {
                            body: reminder.text,
                            icon: 'https://cdn-icons-png.flaticon.com/512/3239/3239952.png',
                            badge: 'https://cdn-icons-png.flaticon.com/512/3239/3239952.png',
                            tag: reminder.id.toString(),
                            requireInteraction: true,
                            vibrate: [500, 200, 500, 200, 500],
                            silent: false,
                            data: { reminderId: reminder.id }
                        });
                    }
                });
                
                self.addEventListener('notificationclick', event => {
                    event.notification.close();
                    event.waitUntil(clients.openWindow('/'));
                });
                
                // Keep service worker alive with periodic ping
                setInterval(() => {
                    // This helps keep SW active in background
                }, 20000);
            `;
            
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(reg => {
                    console.log('Service Worker registered:', reg.scope);
                    window.swRegistration = reg;
                    
                    // Request periodic background sync (if supported)
                    if ('periodicSync' in reg) {
                        reg.periodicSync.register('reminder-check', {
                            minInterval: 15 * 60 * 1000 // 15 minutes
                        }).catch(() => {});
                    }
                })
                .catch(err => console.log('SW registration failed:', err));
        }

        class ReminderApp {
            constructor() {
                this.reminders = JSON.parse(localStorage.getItem('reminders')) || [];
                this.audio = document.getElementById('notifSound');
                this.isListening = false;
                this.recognition = null;
                this.isRepeating = true;
                this.alertInterval = null;
                this.activeAlerts = [];
                this.lastAlertTime = 0;
                this.init();
            }

            init() {
                this.updateDate();
                this.render();
                this.setupEvents();
                this.startScheduler();
                this.requestNotifPermission();
                this.initVoice();
                this.updateDebugInfo();
                this.scheduleAllNotifications();
            }

            scheduleAllNotifications() {
                // Schedule notifications for all pending reminders via Service Worker
                if (window.swRegistration && window.swRegistration.active) {
                    this.reminders.forEach(r => {
                        if (!r.completed && !r.notified) {
                            window.swRegistration.active.postMessage({
                                type: 'SCHEDULE_NOTIFICATION',
                                reminder: r
                            });
                        }
                    });
                }
            }

            updateDate() {
                const now = new Date();
                document.getElementById('currentDay').textContent = now.toLocaleDateString('en-US', { weekday: 'long' });
                document.getElementById('currentDate').textContent = now.getDate();
                document.getElementById('currentMonth').textContent = now.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            }

            setupEvents() {
                document.getElementById('addBtn').addEventListener('click', () => this.addReminder());
                document.getElementById('taskInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addReminder();
                });
                document.getElementById('notifBtn').addEventListener('click', () => this.requestNotifPermission());
                document.getElementById('micBtn').addEventListener('click', () => this.toggleVoice());
                document.getElementById('repeatBtn').addEventListener('click', () => this.toggleRepeating());

                document.addEventListener('click', () => {
                    if (this.audio) { this.audio.load(); }
                }, { once: true });

                // Listen for notification clicks from Service Worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.addEventListener('message', event => {
                        if (event.data && event.data.type === 'NOTIFICATION_CLICKED') {
                            this.openReminder(event.data.reminderId);
                        }
                    });
                }
            }

            openReminder(id) {
                window.focus();
                const r = this.reminders.find(x => x.id === id);
                if (r) {
                    this.showToast(`📌 ${r.text}`);
                }
            }

            initVoice() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    this.recognition.lang = 'en-US';

                    this.recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        document.getElementById('taskInput').value = transcript;
                        this.showToast(`🎤 Heard: "${transcript}"`);
                        setTimeout(() => this.addReminder(), 500);
                    };

                    this.recognition.onend = () => {
                        this.isListening = false;
                        document.getElementById('micBtn').classList.remove('listening');
                        document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i>';
                    };

                    this.recognition.onerror = (event) => {
                        this.isListening = false;
                        document.getElementById('micBtn').classList.remove('listening');
                        document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i>';
                        if (event.error === 'not-allowed') {
                            this.showToast('🎤 Microphone blocked!');
                        }
                    };
                } else {
                    document.getElementById('micBtn').style.display = 'none';
                }
            }

            toggleVoice() {
                if (!this.recognition) { this.showToast('🎤 Voice not supported'); return; }
                if (this.isListening) {
                    this.recognition.stop();
                    this.isListening = false;
                    document.getElementById('micBtn').classList.remove('listening');
                    document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i>';
                } else {
                    this.recognition.start();
                    this.isListening = true;
                    document.getElementById('micBtn').classList.add('listening');
                    document.getElementById('micBtn').innerHTML = '<i class="fas fa-stop"></i>';
                    this.showToast('🎤 Listening...');
                }
            }

            toggleRepeating() {
                this.isRepeating = !this.isRepeating;
                const btn = document.getElementById('repeatBtn');
                if (this.isRepeating) {
                    btn.classList.remove('active');
                    btn.innerHTML = '<i class="fas fa-redo"></i>';
                    this.showToast('✓ Repeating alerts ON (every 5s)');
                } else {
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="fas fa-redo-alt"></i>';
                    this.showToast('⚠ Repeating alerts OFF (one-time alert)');
                }
                this.updateDebugInfo();
            }

            stopAllAlerts() {
                this.activeAlerts.forEach(id => {
                    const r = this.reminders.find(x => x.id === id);
                    if (r) r.notified = true;
                });
                this.activeAlerts = [];
                if (this.alertInterval) {
                    clearInterval(this.alertInterval);
                    this.alertInterval = null;
                }
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }
                document.getElementById('alertBanner').classList.remove('show');
                document.getElementById('repeatBtn').classList.remove('active');
                this.lastAlertTime = 0;
                this.save();
                this.render();
                this.showToast('All alerts stopped');
            }

            parseTime(text) {
                const now = new Date();
                let target = new Date(now);
                const lower = text.toLowerCase();
                let timeSet = false;

                const timePatterns = [
                    /(\d{1,2})\s*(?::(\d{2}))?\s*(am|pm)/i,
                    /(\d{1,2}):(\d{2})/
                ];

                for (const pattern of timePatterns) {
                    const match = text.match(pattern);
                    if (match) {
                        let hours = parseInt(match[1]);
                        const minutes = match[2] ? parseInt(match[2]) : 0;
                        const ampm = match[3];

                        if (ampm) {
                            if (ampm.toLowerCase() === 'pm' && hours < 12) hours += 12;
                            if (ampm.toLowerCase() === 'am' && hours === 12) hours = 0;
                        }

                        target.setHours(hours, minutes, 0, 0);
                        timeSet = true;
                        break;
                    }
                }

                const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
                for (let i = 0; i < days.length; i++) {
                    if (lower.includes(days[i])) {
                        const currentDay = target.getDay();
                        let daysUntil = i - currentDay;
                        if (daysUntil <= 0) daysUntil += 7;
                        target.setDate(target.getDate() + daysUntil);
                        if (!timeSet) target.setHours(9, 0, 0, 0);
                        timeSet = true;
                        break;
                    }
                }

                if (lower.includes('tomorrow')) {
                    target.setDate(target.getDate() + 1);
                    if (!timeSet) target.setHours(9, 0, 0, 0);
                    timeSet = true;
                }
                
                if (lower.includes('today')) {
                    if (!timeSet) target.setHours(9, 0, 0, 0);
                    timeSet = true;
                }
                
                if (lower.includes('next week')) {
                    target.setDate(target.getDate() + 7);
                    if (!timeSet) target.setHours(9, 0, 0, 0);
                    timeSet = true;
                }

                const datePatterns = [
                    /(\d{1,2})(?:st|nd|rd|th)/i,
                    /(?:jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|september|oct|october|nov|november|dec|december)\s+(\d{1,2})/i,
                    /(\d{1,2})\s+(?:jan|january|feb|february|mar|march|apr|april|may|jun|june|jul|july|aug|august|sep|september|oct|october|nov|november|dec|december)/i
                ];

                for (const pattern of datePatterns) {
                    const match = text.match(pattern);
                    if (match) {
                        let day = parseInt(match[1]);
                        if (match[2]) day = parseInt(match[2]);
                        
                        const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
                        const fullMonths = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
                        
                        for (let i = 0; i < 12; i++) {
                            if (lower.includes(months[i]) || lower.includes(fullMonths[i])) {
                                target.setMonth(i);
                                break;
                            }
                        }
                        
                        target.setDate(day);
                        
                        if (target < now && !lower.includes('today')) {
                            target.setMonth(target.getMonth() + 1);
                        }
                        
                        if (!timeSet) target.setHours(9, 0, 0, 0);
                        timeSet = true;
                        break;
                    }
                }

                const inPatterns = [
                    { pattern: /in\s+(\d+)\s*(min|minute|minutes)/i, handler: (val) => target.setMinutes(target.getMinutes() + val) },
                    { pattern: /in\s+(\d+)\s*(hour|hours|hr|hrs)/i, handler: (val) => target.setHours(target.getHours() + val) },
                    { pattern: /in\s+(\d+)\s*(day|days)/i, handler: (val) => target.setDate(target.getDate() + val) }
                ];

                for (const { pattern, handler } of inPatterns) {
                    const match = lower.match(pattern);
                    if (match) {
                        handler(parseInt(match[1]));
                        timeSet = true;
                        break;
                    }
                }

                if (!timeSet) {
                    target.setHours(target.getHours() + 1);
                }

                if (target < now && !lower.includes('today')) {
                    target.setDate(target.getDate() + 1);
                }

                return target;
            }

            addReminder() {
                const input = document.getElementById('taskInput');
                const text = input.value.trim();
                if (!text) { this.showToast('Please enter a reminder'); return; }

                const scheduledTime = this.parseTime(text);
                const reminder = {
                    id: Date.now(),
                    text: text,
                    time: scheduledTime.getTime(),
                    completed: false,
                    notified: false
                };

                this.reminders.push(reminder);
                this.save();
                this.render();
                this.scheduleAllNotifications();
                input.value = '';
                
                const timeStr = scheduledTime.toLocaleString([], { 
                    weekday: 'short',
                    month: 'short', 
                    day: 'numeric',
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true
                });
                this.showToast(`✓ Set for ${timeStr}`);
                this.updateDebugInfo();
            }

            toggleComplete(id) {
                const r = this.reminders.find(x => x.id === id);
                if (r) {
                    r.completed = true;
                    r.notified = true;
                    this.activeAlerts = this.activeAlerts.filter(aid => aid !== id);
                    if (this.activeAlerts.length === 0 && this.alertInterval) {
                        clearInterval(this.alertInterval);
                        this.alertInterval = null;
                        if (this.audio) {
                            this.audio.pause();
                            this.audio.currentTime = 0;
                        }
                        document.getElementById('alertBanner').classList.remove('show');
                    }
                    this.save();
                    this.render();
                    this.showToast('✓ Reminder completed');
                }
            }

            delete(id) {
                this.activeAlerts = this.activeAlerts.filter(aid => aid !== id);
                this.reminders = this.reminders.filter(x => x.id !== id);
                if (this.activeAlerts.length === 0 && this.alertInterval) {
                    clearInterval(this.alertInterval);
                    this.alertInterval = null;
                    if (this.audio) {
                        this.audio.pause();
                        this.audio.currentTime = 0;
                    }
                    document.getElementById('alertBanner').classList.remove('show');
                }
                this.save();
                this.render();
                this.updateDebugInfo();
            }

            save() { localStorage.setItem('reminders', JSON.stringify(this.reminders)); }

            render() {
                const list = document.getElementById('reminderList');
                const now = Date.now();
                this.reminders.sort((a, b) => a.time - b.time);

                document.getElementById('countPending').textContent = this.reminders.filter(r => !r.completed).length;
                document.getElementById('countToday').textContent = this.reminders.filter(r => !r.completed && new Date(r.time).toDateString() === new Date().toDateString()).length;
                document.getElementById('countDone').textContent = this.reminders.filter(r => r.completed).length;

                if (this.reminders.length === 0) {
                    list.innerHTML = '<div class="empty"><i class="fas fa-clipboard-list" style="font-size: 2rem; margin-bottom: 10px;"></i><br>No reminders yet.</div>';
                    return;
                }

                list.innerHTML = this.reminders.map(r => {
                    const date = new Date(r.time);
                    const isOverdue = !r.completed && r.time < now;
                    
                    const timeStr = date.toLocaleString([], { 
                        weekday: 'short',
                        month: 'short', 
                        day: 'numeric', 
                        hour: 'numeric', 
                        minute: '2-digit',
                        hour12: true
                    });
                    
                    return `
                        <div class="reminder-item ${r.completed ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}">
                            <div class="r-info">
                                <h4 style="${r.completed ? 'text-decoration: line-through' : ''}">${r.text}</h4>
                                <p>
                                    <i class="far fa-clock"></i> ${timeStr}
                                    ${isOverdue ? '<span style="color:#ef4444; margin-left:8px; font-weight:600">● Overdue</span>' : ''}
                                </p>
                            </div>
                            <div class="actions">
                                <button class="btn-icon" onclick="app.toggleComplete(${r.id})"><i class="fas ${r.completed ? 'fa-undo' : 'fa-check'}"></i></button>
                                <button class="btn-icon" onclick="app.delete(${r.id})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            startScheduler() {
                setInterval(() => {
                    const now = Date.now();
                    const overdueReminders = this.reminders.filter(r => 
                        !r.completed && !r.notified && r.time <= now
                    );

                    if (overdueReminders.length > 0) {
                        const timeSinceLastAlert = now - this.lastAlertTime;
                        
                        if (timeSinceLastAlert >= 5000 || this.lastAlertTime === 0) {
                            if (!this.alertInterval) {
                                this.activeAlerts = overdueReminders.map(r => r.id);
                                document.getElementById('alertBanner').classList.add('show');
                            }
                            
                            overdueReminders.forEach(r => this.triggerNotification(r));
                            this.lastAlertTime = now;
                            
                            if (this.isRepeating && !this.alertInterval) {
                                this.alertInterval = setInterval(() => {
                                    const stillActive = this.reminders.filter(r => 
                                        !r.completed && !r.notified && r.time <= now
                                    );
                                    if (stillActive.length > 0) {
                                        stillActive.forEach(r => this.triggerNotification(r));
                                    } else {
                                        this.stopAllAlerts();
                                    }
                                }, 5000);
                            }
                        }
                    }
                    
                    this.updateDebugInfo();
                }, 1000);
            }

            triggerNotification(r) {
                // 1. Show Toast
                this.showToast(`🔔 ${r.text}`);
                
                // 2. Vibrate
                if ('vibrate' in navigator) {
                    navigator.vibrate([500, 200, 500, 200, 500]);
                }
                
                // 3. Play Sound
                this.playSound();
                
                // 4. Browser Notification (WORKS WHEN APP IS CLOSED)
                if ('Notification' in window && Notification.permission === 'granted') {
                    try {
                        const notif = new Notification('⏰ REMINDER!', {
                            body: r.text,
                            icon: 'https://cdn-icons-png.flaticon.com/512/3239/3239952.png',
                            badge: 'https://cdn-icons-png.flaticon.com/512/3239/3239952.png',
                            tag: r.id.toString(),
                            requireInteraction: true,
                            vibrate: [500, 200, 500, 200, 500],
                            silent: false,
                            data: { reminderId: r.id }
                        });
                        
                        notif.onclick = () => {
                            window.focus();
                            notif.close();
                        };
                    } catch (e) {
                        console.error('Notification error:', e);
                    }
                }
                
                // 5. Send to Service Worker for background delivery
                if (window.swRegistration && window.swRegistration.active) {
                    window.swRegistration.active.postMessage({
                        type: 'TRIGGER_NOW',
                        reminder: r
                    });
                }
            }

            playSound() {
                try {
                    if (this.audio) {
                        this.audio.pause();
                        this.audio.currentTime = 0;
                        this.audio.play().catch(() => this.playBeep());
                    } else {
                        this.playBeep();
                    }
                } catch (e) {
                    this.playBeep();
                }
            }

            playBeep() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        const ctx = new AudioContext();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = 800;
                        gain.gain.setValueAtTime(0.5, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.5);
                    }
                } catch (e) {}
            }

            async requestNotifPermission() {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'granted') {
                    document.getElementById('notifBtn').innerHTML = '<i class="fas fa-bell" style="color:#10b981"></i>';
                    return;
                }
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    this.showToast('✓ Notifications enabled');
                    document.getElementById('notifBtn').innerHTML = '<i class="fas fa-bell" style="color:#10b981"></i>';
                    
                    new Notification('Smart Reminder', {
                        body: 'You will get alerts even when app is closed!',
                        icon: 'https://cdn-icons-png.flaticon.com/512/3239/3239952.png',
                        vibrate: [200, 100, 200]
                    });
                }
            }

            showToast(msg) {
                const toast = document.getElementById('toast');
                document.getElementById('toastMsg').textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            updateDebugInfo() {
                const now = new Date();
                const nextReminder = this.reminders.filter(r => !r.completed && !r.notified).sort((a, b) => a.time - b.time)[0];
                const debug = document.getElementById('debugInfo');
                const activeCount = this.activeAlerts.length;
                
                if (activeCount > 0) {
                    debug.innerHTML = `🚨 <b>${activeCount} Active Alert(s)</b> | Repeating: <b>${this.isRepeating ? 'Every 5s' : 'OFF'}</b>`;
                } else if (nextReminder) {
                    const timeLeft = nextReminder.time - now.getTime();
                    
                    if (timeLeft > 0) {
                        const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                        
                        const hStr = hours.toString().padStart(2, '0');
                        const mStr = minutes.toString().padStart(2, '0');
                        const sStr = seconds.toString().padStart(2, '0');
                        
                        debug.innerHTML = `⏰ Next reminder in: <b style="color:#6366f1">${hStr}h ${mStr}m ${sStr}s</b>`;
                    } else {
                        debug.innerHTML = `⏰ Reminder due now!`;
                    }
                } else {
                    debug.innerHTML = `⏰ No pending reminders | Scheduler: <b style="color:#10b981">Running</b>`;
                }
            }
        }

        const app = new ReminderApp();
    </script>
</body>
